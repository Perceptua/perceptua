<header>
  <!-- Same geometry as scripts/favicon.js, on a unit L = 100 about the crossing. -->
  <a href="/" class="header-logo" aria-hidden="true" tabindex="-1">
    <svg viewBox="-104 -104 208 308" fill="none" stroke-width="1">
      <path vector-effect="non-scaling-stroke"
            d="M0,-100 V200 M-100,0 H100 M33.3,-66.7 V66.7 M0,-100 A100,100 0 0 1 -100,0 M100,0 A100,100 0 0 0 0,100"/>
    </svg>
  </a>

  <a href="/">
    <h1 id="site-title">Perceptua</h1>
  </a>

  <div class="header-icons js-only">
    <button type="button" class="icon-button" id="search-toggle"
            aria-label="Search" aria-expanded="false" aria-controls="search">
      <i class="fas fa-search"></i>
    </button>
    <button type="button" class="icon-button" id="theme-toggle" aria-label="Switch light or dark theme">
      <i class="fas fa-moon icon-moon"></i>
      <i class="fas fa-sun icon-sun"></i>
    </button>
  </div>
</header>

<div class="search hidden js-only" id="search" role="search">
  <input type="search" id="search-input" placeholder="Search" aria-label="Search posts" autocomplete="off">
  <ul class="search-results" id="search-results"></ul>
</div>
