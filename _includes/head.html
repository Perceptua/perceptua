<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

{% assign page_title = title | default: "Perceptua" %}
{% assign page_description = description | default: "An Art of Histories" %}

<title>{% if title %}Perceptua - {{ title }}{% else %}Perceptua{% endif %}</title>
<meta name="description" content="{{ page_description }}">
<meta name="keywords" content="perceptua{% if keywords %}, {{ keywords }}{% endif %}">

<!-- Twitter -->
<meta name="twitter:title" content="{{ page_title }}">
<meta name="twitter:description" content="{{ page_description }}">
<meta name="twitter:image" content="https://perceptua.blue/static/images/perceptua-low-poly-black-wide.svg">
<meta name="twitter:card" content="summary_large_image">

<!-- Stylesheets -->
<link rel="stylesheet" href="/static/main.css">
<!-- TODO: Add subresource integrity (SRI) hash for Font Awesome 5.15.4 -->
<link rel="stylesheet" href="https://use.fontawesome.com/releases/v5.15.4/css/all.css"
      crossorigin="anonymous">

<!-- Icons -->
<link rel="apple-touch-icon" sizes="180x180" href="/favicon/apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon/favicon-16x16.png">
<link rel="manifest" href="/favicon/site.webmanifest">
<link rel="mask-icon" href="/favicon/safari-pinned-tab.svg" color="#676087">
<meta name="msapplication-TileColor" content="#000000">
<meta name="theme-color" content="#000000">
